<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Shilrick Monsuller | AI Automation & GHL Specialist</title>
    <meta name="description" content="Shilrick Monsuller, AI Automation and GoHighLevel Specialist: n8n, Zapier, Make.com and Claude." />
    <meta name="author" content="Shilrick Monsuller" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#070B14" />
    <!-- <link rel="canonical" href="https://yoursite.com/" /> -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/avatar.webp" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. og:image must be an absolute URL once you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shilrick Monsuller" />
    <meta property="og:title" content="Shilrick Monsuller | AI Automation & GHL Specialist" />
    <meta property="og:description" content="AI Automation and GoHighLevel Specialist: n8n, Zapier, Make.com and Claude." />
    <!-- <meta property="og:url" content="https://yoursite.com/" /> -->
    <!-- <meta property="og:image" content="https://yoursite.com/share.png" /> -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         dark; light is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === 'light') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#FAF8F2');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
